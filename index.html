<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woopy 汪汪 · vocabulaire IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Monde pastel : papier rose pâle, rose surligneur = essentiel, jaune surligneur = à revoir, encre prune pour le texte */
  --paper:#fff7fa;
  --card:#ffffff;
  --ink:#43334a;
  --ink-soft:#8a7790;
  --rose:#ff8fb8;
  --rose-pale:#ffe1ec;
  --jaune:#ffd95a;
  --jaune-pale:#fff5c7;
  --mint:#7fd8be;
  --mint-pale:#dcf6ee;
  --red:#e8576b;
  --line:#f1dbe5;
  --rose-line:#f7c3d6;--rose-deep:#e06f98;--rose-text:#c2416e;
  --jaune-line:#f3e2a0;--jaune-deep:#e2b92e;--jaune-text:#7a6000;
  --bleu:#7fcdee;--bleu-pale:#dcf2fb;--bleu-text:#1d6f93;
  --mint-deep:#57b79b;--ko-pale:#ffe5e9;--track:#f6e9ef;--trace-bg:#fffdfd;
  --on-pastel:#43334a;--overlay:rgba(67,51,74,.35);--woopy-line:#cdb3c1;
  --display:"Baloo 2", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-woopy="light"]){--paper:#1e1923;--card:#2a2330;--ink:#f6eaf1;--ink-soft:#b8a6bf;
  --rose:#ff8fb8;--rose-pale:#4b2a3c;--jaune:#ffd95a;--jaune-pale:#3b3322;--mint:#7fd8be;--mint-pale:#1e3a33;
  --red:#ff7d8f;--line:#41364a;--rose-line:#6b3a52;--rose-deep:#c9568a;--rose-text:#ffa9c8;
  --jaune-line:#5c4f2a;--jaune-deep:#c9a22a;--jaune-text:#ffe08a;--bleu:#7fcdee;--bleu-pale:#1b3341;--bleu-text:#9fdcf5;--mint-deep:#4fa58b;--ko-pale:#4a2530;
  --track:#3a3141;--trace-bg:#241e29;--on-pastel:#43334a;--overlay:rgba(10,6,14,.6);--woopy-line:#8f7d98;
  color-scheme:dark;}}
:root[data-theme="dark"]:not([data-woopy="light"]){--paper:#1e1923;--card:#2a2330;--ink:#f6eaf1;--ink-soft:#b8a6bf;
  --rose:#ff8fb8;--rose-pale:#4b2a3c;--jaune:#ffd95a;--jaune-pale:#3b3322;--mint:#7fd8be;--mint-pale:#1e3a33;
  --red:#ff7d8f;--line:#41364a;--rose-line:#6b3a52;--rose-deep:#c9568a;--rose-text:#ffa9c8;
  --jaune-line:#5c4f2a;--jaune-deep:#c9a22a;--jaune-text:#ffe08a;--bleu:#7fcdee;--bleu-pale:#1b3341;--bleu-text:#9fdcf5;--mint-deep:#4fa58b;--ko-pale:#4a2530;
  --track:#3a3141;--trace-bg:#241e29;--on-pastel:#43334a;--overlay:rgba(10,6,14,.6);--woopy-line:#8f7d98;
  color-scheme:dark;}
:root[data-woopy="dark"]{--paper:#1e1923;--card:#2a2330;--ink:#f6eaf1;--ink-soft:#b8a6bf;
  --rose:#ff8fb8;--rose-pale:#4b2a3c;--jaune:#ffd95a;--jaune-pale:#3b3322;--mint:#7fd8be;--mint-pale:#1e3a33;
  --red:#ff7d8f;--line:#41364a;--rose-line:#6b3a52;--rose-deep:#c9568a;--rose-text:#ffa9c8;
  --jaune-line:#5c4f2a;--jaune-deep:#c9a22a;--jaune-text:#ffe08a;--bleu:#7fcdee;--bleu-pale:#1b3341;--bleu-text:#9fdcf5;--mint-deep:#4fa58b;--ko-pale:#4a2530;
  --track:#3a3141;--trace-bg:#241e29;--on-pastel:#43334a;--overlay:rgba(10,6,14,.6);--woopy-line:#8f7d98;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.zh{font-family:var(--zh)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.app{max-width:760px;margin:0 auto;padding:12px 16px 96px;min-height:100%}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px}
.brand small{font-family:var(--zh);font-weight:600;color:var(--rose);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.bone{background:var(--jaune-pale);border-color:var(--jaune-line)}
.chip.count{background:var(--rose-pale);border-color:var(--rose-line)}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.nav button .ic{font-family:var(--zh);font-size:19px;line-height:1.1}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"] .ic{color:var(--rose)}
.hidden{display:none !important}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:17px;background:var(--rose);color:#fff;box-shadow:0 4px 0 var(--rose-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rose-deep)}
.btn.alt{background:var(--jaune);color:var(--on-pastel);box-shadow:0 4px 0 var(--jaune-deep)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.mint{background:var(--mint);color:#173f35;box-shadow:0 4px 0 var(--mint-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:800}
.tag.r{background:var(--rose-pale);color:var(--rose-text)}
.tag.j{background:var(--jaune-pale);color:var(--jaune-text)}
.tag.b{background:var(--bleu-pale);color:var(--bleu-text)}
.bar.b>i{background:linear-gradient(90deg,#55b7e0,var(--bleu))}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.hero .woopywrap{margin:0 auto}}
.woopywrap{width:200px;height:200px;position:relative}
.woopywrap svg{width:100%;height:100%;overflow:visible}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700}
.bubble .zh{color:var(--rose-text)}
.stage{font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:8px}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rose),#ffb3cd)}
.bar.y>i{background:linear-gradient(90deg,#f7c834,var(--jaune))}
.bar.m>i{background:linear-gradient(90deg,#5fcaa9,var(--mint))}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-variant-numeric:tabular-nums}
.countdown{display:flex;align-items:center;gap:12px;background:var(--jaune-pale);border:1.5px solid var(--jaune-line);border-radius:18px;padding:12px 14px}
.countdown .n{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- setup ---------- */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 12px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--rose-pale);border-color:var(--rose);color:var(--rose-text)}
.seg.y button[aria-pressed="true"]{background:var(--jaune-pale);border-color:var(--jaune-deep);color:var(--jaune-text)}
.label{font-weight:800;font-size:14px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}

/* ---------- game ---------- */
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hearts{font-size:22px;letter-spacing:2px}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px 16px;text-align:center;position:relative}
.prompt-kind{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.big{font-family:var(--zh);font-size:56px;line-height:1.2;margin:8px 0;word-break:keep-all}
.big.fr{font-family:var(--display);font-size:32px;font-weight:700}
.big.py{font-family:var(--body);font-size:36px;font-weight:800}
.sentence{font-family:var(--zh);font-size:24px;line-height:1.7;margin:10px 0}
.sentence .gap{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--rose);margin:0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line);min-height:58px}
.opt.zh{font-size:26px}
.opt.ok{background:var(--mint-pale);border-color:var(--mint);box-shadow:0 3px 0 var(--mint)}
.opt.ko{background:var(--ko-pale);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.opt:disabled{cursor:default}
.answer{display:flex;gap:8px;margin-top:14px}
.answer input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:20px;font-family:var(--body);background:var(--paper);color:var(--ink)}
.hint{font-size:13px;color:var(--ink-soft);margin-top:8px}
.feedback{margin-top:12px;border-radius:18px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center}
.feedback.ok{background:var(--mint-pale)}
.feedback.ko{background:var(--ko-pale)}
.feedback .mini{width:76px;height:76px}
.feedback .word{font-family:var(--zh);font-size:24px;font-weight:700}
.feedback .ex{font-family:var(--zh);font-size:15px;color:var(--ink-soft);margin-top:2px}
.feedback .say{font-weight:800}
.flash{perspective:900px;margin:6px auto;max-width:420px;height:260px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:6px}
.flash .back{transform:rotateY(180deg);background:var(--rose-pale)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.pairs button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:700;min-height:54px;box-shadow:0 3px 0 var(--line)}
.pairs button.zh{font-size:24px}
.pairs button.sel{border-color:var(--rose);background:var(--rose-pale)}
.pairs button.done{visibility:hidden}
.pairs button.ko{border-color:var(--red);background:var(--ko-pale)}
.timer{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.trace{width:260px;height:260px;margin:8px auto;background:
  linear-gradient(var(--line),var(--line)) center/100% 1.5px no-repeat,
  linear-gradient(var(--line),var(--line)) center/1.5px 100% no-repeat,var(--trace-bg);border:2px dashed var(--rose-line);border-radius:16px;touch-action:none}

/* ---------- shop / badges / lexique ---------- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .ico{width:64px;height:64px}
.item .nm{font-weight:800}
.item .zhn{font-family:var(--zh);color:var(--ink-soft);font-size:14px}
.item.on{border-color:var(--rose);background:var(--rose-pale)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border-radius:18px;padding:12px;border:1.5px dashed var(--line);text-align:center;color:var(--ink-soft)}
.badge .b{font-family:var(--zh);font-size:30px;width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--ink-soft)}
.badge.got{border-style:solid;color:var(--ink);background:var(--card)}
.badge.got .b{background:var(--jaune);color:var(--on-pastel)}
.badge .t{font-weight:800}
.badge .d{font-size:13px}
.lex{display:flex;flex-direction:column;gap:6px}
.lexrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--jaune);border-radius:14px;padding:8px 12px}
.lexrow.r{border-left-color:var(--rose)}
.lexrow.b{border-left-color:var(--bleu)}
.lexrow .h{font-family:var(--zh);font-size:22px;min-width:3.2em}
.lexrow .p{font-weight:700}
.lexrow .f{font-size:14px;color:var(--ink-soft)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--mint)}
input[type=text],input[type=date],select{border:2px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-family:var(--body);background:var(--card);color:var(--ink)}

.howto{background:var(--jaune-pale);border:1.5px solid var(--jaune-line);border-radius:16px;padding:12px 14px}
.howto summary{font-weight:800;cursor:pointer}
.howto ol{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* ---------- mode dictateur ---------- */
.dictbar{background:#d62b2b;color:#fff3c4;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.dictbar b{color:#ffd23f}
body.dict .top{border-bottom:4px solid #d62b2b;margin-bottom:10px}
body.dict .brand small{color:#d62b2b}
body.dict .nav{border-top:3px solid #d62b2b}
.dictseg button[data-v="1"][aria-pressed="true"]{background:#d62b2b;border-color:#9e1b1b;color:#fff3c4}
@keyframes twitch{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-7deg) scale(1.03)}90%{transform:rotate(7deg) scale(1.03)}93%{transform:rotate(-5deg)}96%{transform:rotate(4deg)}}
.w-dict .wbody{animation:twitch 2.2s ease-in-out infinite}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:24px;padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:90vw;text-align:center}

/* ---------- woopy animation ---------- */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.wbody{filter:drop-shadow(0 0 1.2px var(--woopy-line)) drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.w-happy .wbody{animation:bounce .9s ease-in-out infinite}
.w-oops .wbody{animation:shake .4s ease-in-out 2}
.wtail{transform-origin:150px 150px;animation:wag 1.1s ease-in-out infinite}
.w-sad .wtail{animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span>Woopy</span><small>汪汪老师</small></div>
    <div class="chips">
      <span class="chip bone" id="chipBones" title="Os gagnés">🦴 0</span>
      <span class="chip count" id="chipMaster" title="Mots maîtrisés">✓ 0</span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Navigation">
  <div class="in">
    <button data-go="home"><span class="ic">家</span>Accueil</button>
    <button data-go="setup"><span class="ic">玩</span>Jouer</button>
    <button data-go="shop"><span class="ic">店</span>Boutique</button>
    <button data-go="badges"><span class="ic">奖</span>Badges</button>
    <button data-go="lexique"><span class="ic">词</span>Lexique</button>
    <button data-go="settings"><span class="ic">设</span>Réglages</button>
  </div>
</nav>
<div id="layer"></div>

<script src="vocab.js"></script>
<script src="hanzi-writer.min.js"></script>
<script>
"use strict";
/* =================== DATA =================== */
const VOCAB = VOCAB_RAW.map((r,i)=>({id:r[0],h:r[0],p:r[1],fr:r[2],c:r[3],src:r[4],ex:r[5]||"",parent:r[6]||null}));
const BYID = Object.fromEntries(VOCAB.map(w=>[w.id,w]));
let STROKES = null;
fetch("strokes.json").then(r=>r.json()).then(d=>{STROKES=d}).catch(()=>{STROKES={}});

/* =================== STATE =================== */
const KEY="woopy_julie_v1";
const DEF={pseudo:"",bones:0,bonesTotal:0,words:{},owned:[],equip:{head:null,face:null,neck:null,hand:null,left:null},badges:{},dictator:false,quota:{d:"",n:0},
  theme:"auto",lastDay:null,days:[],bestChrono:0,traced:0,sessions:0,bestCombo:0,examDate:"",setup:{src:"all",filter:"all",mode:"mix"}};
let S;
function load(){try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=structuredClone(DEF)}
  S.equip=Object.assign({head:null,face:null,neck:null,hand:null,left:null},S.equip||{});S.setup=Object.assign({},DEF.setup,S.setup||{});}
function applyTheme(){document.body.classList.toggle("dict",!!S.dictator);const b=document.querySelector(".brand");if(b)b.innerHTML=S.dictator?'<span>Woopy</span><small>独裁者 · Grand Timonier</small>':'<span>Woopy</span><small>汪汪老师</small>';const r=document.documentElement;if(S.theme==="light"||S.theme==="dark")r.dataset.woopy=S.theme;else delete r.dataset.woopy}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();applyTheme();

const DAY=86400000;
const INTERVALS=[0,0.5,1,3,7,14]; // jours, boîte 0..5
function ws(id){return S.words[id]||(S.words[id]={b:0,t:0,ok:0,ko:0})}
function mastered(id){return (S.words[id]?.b||0)>=3}
function countMastered(list){return list.filter(w=>mastered(w.id)).length}
function todayStr(d=new Date()){return d.toISOString().slice(0,10)}
function daysSince(dstr){if(!dstr)return 99;return Math.floor((Date.parse(todayStr())-Date.parse(dstr))/DAY)}

/* =================== WOOPY (personnage original) =================== */
const STAGES=[
  {min:0,name:"Chiot 小狗",s:.78},
  {min:25,name:"Petit curieux 小学生",s:.86},
  {min:70,name:"Grand étudiant 大学生",s:.94},
  {min:140,name:"Lettré 学者",s:1.0},
  {min:220,name:"Maître Woopy 汪大师",s:1.04}];

const TONE={"ā":["a",1],"á":["a",2],"ǎ":["a",3],"à":["a",4],"ē":["e",1],"é":["e",2],"ě":["e",3],"è":["e",4],"ī":["i",1],"í":["i",2],"ǐ":["i",3],"ì":["i",4],"ō":["o",1],"ó":["o",2],"ǒ":["o",3],"ò":["o",4],"ū":["u",1],"ú":["u",2],"ǔ":["u",3],"ù":["u",4],"ǖ":["v",1],"ǘ":["v",2],"ǚ":["v",3],"ǜ":["v",4],"ü":["v",0]};
function canon(str){ // -> {l: lettres sans tons, t: suite des tons}
  str=str.toLowerCase().normalize("NFC").replace(/u:/g,"v");
  let l="",t=[];
  for(const ch of str){
    if(TONE[ch]){l+=TONE[ch][0];if(TONE[ch][1])t.push(TONE[ch][1]);}
    else if(/[a-z]/.test(ch))l+=ch;
    else if(/[1-4]/.test(ch))t.push(+ch);
  }
  return {l,t:t.join("")};
}
function checkPinyin(input,word){
  const isZh=/[\u3400-\u9fff]/.test(input);
  if(isZh)return input.replace(/[\s，。？！,.?!]/g,"")===word.h;
  const u=canon(input);if(!u.l)return false;
  return word.p.split(" / ").some(alt=>{
    const c=canon(alt);if(c.l!==u.l)return false;if(c.t===u.t)return true;
    // tolérance des changements de ton de 一 et 不
    if(/[一不]/.test(word.h)&&c.t.length===u.t.length){
      for(let i=0;i<c.t.length;i++){if(c.t[i]!==u.t[i]&&!("124".includes(c.t[i])&&"124".includes(u.t[i])))return false}
      return true;}
    return false;});
}

function pool(src=S.setup.src,filter=S.setup.filter){
  let l=VOCAB.filter(w=>src==="all"||w.src.includes(src));
  if(filter==="rose")l=l.filter(w=>w.c==="r");
  if(filter==="bleu")l=l.filter(w=>w.c==="b");
  if(filter==="err")l=l.filter(w=>{const s=S.words[w.id];return s&&s.ko>0&&s.b<3});
  return l;
}
function weight(w){
  const s=ws(w.id);const due=Date.now()-s.t>=INTERVALS[s.b]*DAY;
  return (due?3:0.6)*(6-s.b)*(w.c==="r"?2.2:w.c==="b"?1.4:1)*(s.ko>s.ok?1.5:1);
}
let recent=[];
function pickWord(list,filterFn){
  let cand=list.filter(w=>!recent.includes(w.id)&&(!filterFn||filterFn(w)));
  if(!cand.length)cand=list.filter(w=>!filterFn||filterFn(w));
  if(!cand.length)cand=list;
  let tot=cand.reduce((a,w)=>a+weight(w),0),r=Math.random()*tot;
  for(const w of cand){r-=weight(w);if(r<=0){recent.push(w.id);if(recent.length>Math.min(6,Math.floor(list.length/2)))recent.shift();return w}}
  return cand[0];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function distractors(w,key,n=3){
  const seen=new Set([w[key]]);const sameLen=shuffle(VOCAB.filter(x=>x.id!==w.id&&!x.parent&&x[key]!==w[key]&&[...x.h].length===[...w.h].length));
  const other=shuffle(VOCAB.filter(x=>x.id!==w.id&&x[key]!==w[key]));
  const out=[];for(const x of [...sameLen,...other]){if(out.length>=n)break;if(!seen.has(x[key])){seen.add(x[key]);out.push(x)}}
  return out;
}

function grade(w,ok){
  const s=ws(w.id);const wasMastered=s.b>=3;
  if(ok){s.ok++;s.b=Math.min(5,s.b+1)}else{s.ko++;s.b=Math.max(0,s.b-2)}
  s.t=Date.now();
  const td=todayStr();if(!S.quota||S.quota.d!==td)S.quota={d:td,n:0};S.quota.n++;
  markDay();save();
  if(!wasMastered&&s.b>=3)checkStageUp();
}

function startGame(){

function gameBar(extra=""){
  return `<div class="gamebar"><button class="btn ghost" id="quit" style="padding:8px 12px;font-size:15px">Terminer</button>
  <div class="row" style="gap:12px"><span class="chip">${game.n} q.</span>${game.combo>=3?`<span class="chip count">连 ×${game.combo}</span>`:""}${extra}</div>

function bindQuit(){$("#quit").onclick=()=>endGame()}
function nextQ(){
  if(game.lives<=0)return endGame();

  if(m==="mix"){const r=Math.random();m=r<.42?"qcm":r<.64?"type":r<.84?"trous":r<.93?"pairs":"flash"}

  else{game.combo=0;game.missed.add(w.id);if(!noLife){game.lives--;game.lostLife=true}

const DIRS=[["zh2fr","Que veut dire…"],["fr2zh","Comment dit-on…"],["zh2py","Quel est le pinyin de…"],["py2zh","Quel caractère pour…"]];

  const w=pickWord(game.list);
  const [dir,label]=w.c==="b"?pick(DIRS.filter(d=>d[0]==="zh2fr"||d[0]==="zh2py")):pick(DIRS);
  let prompt,key,cls="";
  if(dir==="zh2fr"){prompt=`<div class="big">${esc(w.h)}</div>`;key="fr"}
  if(dir==="fr2zh"){prompt=`<div class="big fr">${esc(w.fr)}</div>`;key="h";cls="zh"}
  if(dir==="zh2py"){prompt=`<div class="big">${esc(w.h)}</div>`;key="p"}
  if(dir==="py2zh"){prompt=`<div class="big py">${esc(w.p)}</div>`;key="h";cls="zh"}
  const opts=shuffle([w,...distractors(w,key)]);
  view.innerHTML=gameBar()+`<section class="qcard"><div class="prompt-kind">${label} <span class="tag ${w.c}">${colName(w.c)}</span></div>${prompt}
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${cls}" data-i="${i}">${esc(o[key])}</button>`).join("")}</div></section>`;

function chrono(){

    $("#cq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=opts[+b.dataset.i][key]===w[key];grade(w,ok);game.n++;
      if(ok){score++;game.ok++;game.bones++;addBones(1)}else{game.missed.add(w.id);t=Math.max(0,t-3)}
      b.classList.add(ok?"ok":"ko");$("#sc").textContent=score;setTimeout(draw,ok?150:350)})};
  view.innerHTML=`<div class="gamebar"><button class="btn ghost" id="quit" style="padding:8px 12px;font-size:15px">Terminer</button><span class="timer" id="tm">60</span><span class="chip count">Score <b id="sc" style="margin-left:4px">0</b></span></div>
    <section class="qcard"><div class="prompt-kind">Course contre la montre · une erreur = −3 s</div><div id="cq"></div></section>`;
  bindQuit();draw();
  game.timer=setInterval(()=>{t--;$("#tm").textContent=Math.max(0,t);if(t<=0){clearInterval(game.timer);game.timer=null;game.chronoScore=score;if(score>S.bestChrono){S.bestChrono=score;save()}endGame()}},1000);
}
function traceChars(){const set=[];pool().filter(w=>w.c==="r").forEach(w=>[...w.h].forEach(c=>{if(!set.includes(c))set.push(c)}));return set}
function trace(){
  const chars=traceChars();if(!chars.length)return go("setup");
  const c=pick(chars);const w=VOCAB.find(x=>x.c==="r"&&x.h.includes(c)&&!x.parent)||VOCAB.find(x=>x.h.includes(c));
  view.innerHTML=gameBar()+`<section class="qcard"><div class="prompt-kind">Bonus · trace le caractère dans le bon ordre</div>
    <div class="row" style="justify-content:center"><b class="zh" style="font-size:22px">${esc(w.h)}</b><span style="font-weight:800">${esc(w.p)}</span><span class="muted">${esc(w.fr)}</span></div>
    <div id="tw" class="trace"></div><div class="hint">Le trait correct s'affiche après 3 essais ratés. Touche « Voir » pour l'animation.</div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="anim">Voir l'ordre des traits</button><button class="btn alt" id="skip">Autre caractère</button></div></section>`;
  bindQuit();$("#skip").onclick=()=>trace();
  const make=()=>{if(!STROKES)return setTimeout(make,200);
    if(!STROKES[c]){$("#tw").innerHTML=`<div class="big" style="padding-top:60px">${esc(c)}</div>`;return}
    const writer=HanziWriter.create("tw",c,{width:256,height:256,padding:16,showCharacter:false,showOutline:true,strokeColor:css("--ink"),outlineColor:css("--rose-line"),drawingColor:"#ff6f9f",highlightColor:"#7fd8be",drawingWidth:22,showHintAfterMisses:3,charDataLoader:(ch,done)=>done(STROKES[ch])});
    game.writer=writer;
    const quiz=()=>writer.quiz({onComplete:({totalMistakes})=>{S.traced++;game.n++;game.ok++;const b=totalMistakes<=2?3:1;game.bones+=b;addBones(b);markDay();save();
      const fb=document.createElement("div");fb.className="feedback ok";fb.innerHTML=`<div class="mini">${woopySVG("happy")}</div><div><div class="say">${totalMistakes===0?"写得真好！Pas une rature, calligraphe va.":totalMistakes<=2?`不错！${totalMistakes} petite${totalMistakes>1?"s":""} erreur${totalMistakes>1?"s":""}, je ferme les yeux.`:`嗯… ${totalMistakes} erreurs. Le pinceau t'en veut ?`} +${b} 🦴</div><button class="btn mint wide" id="next" style="margin-top:8px">Caractère suivant</button></div>`;
      $(".qcard").appendChild(fb);$("#next").onclick=()=>trace();}});
    quiz();
    $("#anim").onclick=()=>{writer.cancelQuiz();writer.showCharacter();writer.animateCharacter({onComplete:()=>{setTimeout(()=>{writer.hideCharacter();quiz()},500)}})};
  };make();
}
function endGame(){
  if(game&&game.timer){clearInterval(game.timer);game.timer=null}
  if(!game)return go("home");
  if(game.writer){try{game.writer.cancelQuiz()}catch(e){}}
  const g=game;game=null;
  if(g.n>0){S.sessions++;markDay();save()}
  checkBadges();updChips();
  const pct=g.n?Math.round(g.ok/g.n*100):0;const good=pct>=80;
  const missed=[...g.missed].map(id=>BYID[id]).filter(Boolean);
  const msg=g.chronoScore!=null?`时间到！${g.chronoScore} points. ${g.chronoScore>=S.bestChrono&&g.chronoScore>0?"Nouveau record, je l'accroche au frigo.":`Ton record : ${S.bestChrono}. Tu peux mieux, je le sens.`}`
    :S.dictator?(g.n===0?"DÉSERTION ! Tu quittes le front sans une seule réponse. Le Comité est furieux.":good?"Rapport favorable. Tu es décorée de l'Ordre du Caractère Rouge. 光荣！":g.lives<=0?"Plus de vies. Le Comité ordonne une nouvelle partie. Immédiatement.":"Rapport mitigé. Les mots ratés seront rééduqués. Par toi.")
    :g.n===0?"Déjà fini ? Je n'ai même pas eu le temps de remuer la queue.":good?"太厉害了！Tu vas finir par en savoir plus que moi.":g.lives<=0?"没有命了！Plus de vies… On reprend, 再来一次 ?":"还可以！Pas mal, mais les mots ratés vont revenir te hanter.";
  view.innerHTML=`<section class="card" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
    <div class="woopywrap">${woopySVG(good||g.chronoScore>=15?"happy":g.n?"oops":"normal")}</div>
    <h2>${S.dictator?"Rapport au Comité":"Bilan de la partie"}</h2><div class="bubble">${esc(msg)}</div>
    <div class="row" style="justify-content:center"><span class="chip">${g.ok}/${g.n} bonnes réponses</span><span class="chip bone">+${g.bones} 🦴</span>${g.fines?`<span class="chip count">Amendes : −${g.fines} 🦴</span>`:""}</div>
    ${missed.length?`<div style="width:100%;text-align:left"><p class="label">À revoir</p><div class="lex">${missed.map(lexRow).join("")}</div></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="home">Accueil</button></div></section>`;
  $("#again").onclick=()=>startGame();$("#home").onclick=()=>go("home");
}

/* =================== BOUTIQUE =================== */
function shop(){

   <p class="muted" style="margin:0">Dépense tes os pour habiller Woopy. Une bonne réponse = 1 os, et +2 tous les 5 d'affilée. Touche un accessoire déjà acheté pour le mettre ou l'enlever.</p></div></div>

     return `<div class="item ${on?"on":""}"><svg class="ico" viewBox="${VB[it.id]}">${itemSVG(it.id)}</svg><div class="nm">${it.name}</div><div class="zhn">${it.zh}</div>
     <button class="btn ${own?"ghost":"alt"}" data-it="${it.id}" style="padding:8px 12px;font-size:15px" ${!own&&S.bones<it.cost?"disabled":""}>${own?(on?"Enlever":"Mettre"):`${it.cost} 🦴`}</button></div>`}).join("")}</div></section>`;
  view.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.it);
    if(!S.owned.includes(it.id)){if(S.bones<it.cost)return;S.bones-=it.cost;S.owned.push(it.id);S.equip[it.slot]=it.id;toast(`${it.zh} ! Woopy se trouve très beau.`)}

function badges(){

/* =================== LEXIQUE =================== */
function lexRow(w){const b=S.words[w.id]?.b||0;return `<div class="lexrow ${w.c}"><span class="h">${esc(w.h)}</span><div><div class="p">${esc(w.p)}</div><div class="f">${esc(w.fr)}</div></div><div class="dots" title="Niveau ${b}/5">${[1,2,3,4,5].map(i=>`<i class="${b>=i?"on":""}"></i>`).join("")}</div></div>`}
let lexF={src:"all",c:"all",q:""};
function lexique(){
  view.innerHTML=`<section style="display:flex;flex-direction:column;gap:12px"><h2>Lexique · ${VOCAB.length} mots</h2>
   <div class="row"><select id="ls" aria-label="Fiche"><option value="all">Toutes les fiches</option>${Object.entries(SOURCES).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select>
   <select id="lc" aria-label="Couleur"><option value="all">Toutes les couleurs</option><option value="r">Rose</option><option value="b">Bleu</option><option value="j">Jaune</option></select>
   <input id="lq" type="text" placeholder="Chercher…" aria-label="Chercher" style="flex:1;min-width:140px"></div>
   <div class="lex" id="ll"></div></section>`;
  $("#ls").value=lexF.src;$("#lc").value=lexF.c;$("#lq").value=lexF.q;
  const draw=()=>{const q=lexF.q.trim().toLowerCase();const l=VOCAB.filter(w=>(lexF.src==="all"||w.src.includes(lexF.src))&&(lexF.c==="all"||w.c===lexF.c)&&(!q||w.h.includes(q)||w.fr.toLowerCase().includes(q)||canon(w.p).l.includes(canon(q).l)));
    $("#ll").innerHTML=l.map(lexRow).join("")||`<p class="muted">Rien trouvé.</p>`};
  $("#ls").onchange=e=>{lexF.src=e.target.value;draw()};$("#lc").onchange=e=>{lexF.c=e.target.value;draw()};$("#lq").oninput=e=>{lexF.q=e.target.value;draw()};draw();
}

function bindDict(){document.querySelectorAll(".dictseg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.dictator=b.dataset.v==="1";save();applyTheme();
  g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  toast(S.dictator?"立正！Le Grand Timonier Woopy prend le pouvoir.":"Ouf. Woopy redevient un gentil chiot 汪～")}))}

/* =================== SAUVEGARDE PAR CODE =================== */
function exportCode(){
  const words={};for(const [k,v] of Object.entries(S.words)){if(v.ok||v.ko)words[k]=v}
  const data=Object.assign({},S,{words});
  const bytes=new TextEncoder().encode(JSON.stringify(data));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return "WOOPY1-"+btoa(bin);
}
function importCode(code){
  try{code=(code||"").replace(/\s+/g,"");if(!code.startsWith("WOOPY1-"))return null;
    const bin=atob(code.slice(7));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const d=JSON.parse(new TextDecoder().decode(bytes));if(typeof d!=="object"||!d||typeof d.words!=="object")return null;return d}
  catch(e){return null}
}

/* =================== RÉGLAGES =================== */
function settings(){
  view.innerHTML=`<section class="card" style="display:flex;flex-direction:column;gap:14px">
   <h2>Réglages</h2>
   <label for="sp"><span class="label">Pseudo</span></label><input id="sp" type="text" maxlength="20" value="${esc(S.pseudo)}">
   <label for="sd"><span class="label">Date du contrôle écrit</span></label><input id="sd" type="date" value="${esc(S.examDate)}">
   <div><p class="label">Personnalité de Woopy</p><div class="seg dictseg">${[["0","Gentil (taquin) 🐶"],["1","Dictateur 独裁者 🎖️"]].map(([v,l])=>`<button aria-pressed="${(S.dictator?"1":"0")===v}" data-v="${v}">${l}</button>`).join("")}</div><p class="muted" style="margin:6px 0 0;font-size:14px">En mode dictateur, Woopy porte la casquette, hurle des ordres, et chaque erreur coûte une amende d'un os.</p></div>
   <div><p class="label">Apparence</p><div class="seg" id="th">${[["auto","Auto (comme l'appareil)"],["light","Clair ☀️"],["dark","Sombre 🌙"]].map(([v,l])=>`<button aria-pressed="${(S.theme||"auto")===v}" data-v="${v}">${l}</button>`).join("")}</div></div>
   <button class="btn" id="ss">Enregistrer</button>
   <button class="btn ghost" id="reset">Tout remettre à zéro</button></section>
  <div style="height:12px"></div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
   <h2>Sauvegarder ma progression</h2>
   <p class="muted" style="margin:0">Ta progression est gardée dans ce navigateur, sur cet appareil. Pour ne rien perdre (ou continuer sur un autre appareil), copie ton code de sauvegarde et garde-le dans tes notes ou envoie-le-toi par message.</p>
   <details class="howto" open>
     <summary>Comment marche le code de sauvegarde ?</summary>
     <ol>
       <li><b>C'est une photo de ta progression.</b> Le code contient ton pseudo, tes os, tes accessoires, tes badges et le niveau de chaque mot, au moment où tu le crées.</li>
       <li><b>Pour sauvegarder :</b> touche « Créer mon code de sauvegarde », puis « Copier le code ». Colle-le dans tes notes ou envoie-le-toi par message.</li>
       <li><b>Pour retrouver ta progression</b> (nouveau téléphone, autre ordi, données effacées) : ouvre Woopy, va dans Réglages, colle le code dans « Restaurer une sauvegarde » et touche « Restaurer ».</li>
       <li><b>Il ne se met pas à jour tout seul.</b> Refais un code après chaque grosse session et garde toujours le plus récent.</li>
       <li><b>Restaurer remplace tout</b> ce qu'il y a sur l'appareil par le contenu du code.</li>
     </ol>
     <p class="muted" style="margin:0;font-size:14px">汪！Sans code, ta progression reste seulement dans ce navigateur. Navigation privée ou historique effacé, et pouf, je redeviens un chiot.</p>
   </details>
   <button class="btn alt" id="exp">Créer mon code de sauvegarde</button>
   <div id="expBox" class="hidden" style="display:flex;flex-direction:column;gap:8px">
     <textarea id="expCode" readonly rows="4" aria-label="Code de sauvegarde" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--paper);color:var(--ink);word-break:break-all"></textarea>
     <button class="btn mint" id="copy">Copier le code</button>
     <p class="muted" id="expInfo" style="margin:0;font-size:14px"></p>
   </div>
   <h3 style="margin-top:6px">Restaurer une sauvegarde</h3>
   <textarea id="impCode" rows="3" placeholder="Colle ici ton code WOOPY1-…" aria-label="Code à restaurer" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card);color:var(--ink)"></textarea>
   <button class="btn ghost" id="imp">Restaurer</button>
  </section>`;
  $("#exp").onclick=()=>{const code=exportCode();$("#expCode").value=code;$("#expBox").classList.remove("hidden");
    $("#expInfo").textContent=`Sauvegarde du ${new Date().toLocaleDateString("fr-FR")} : ${countMastered(VOCAB)} mot(s) maîtrisé(s), ${S.bones} os, ${Object.keys(S.badges).length} badge(s).`;};
  $("#copy").onclick=async()=>{const ta=$("#expCode");try{await navigator.clipboard.writeText(ta.value);toast("Code copié ! 复制好了")}catch(e){ta.focus();ta.select();toast("Sélectionné : fais Copier (Ctrl+C / appui long)")}};
  $("#imp").onclick=()=>{const data=importCode($("#impCode").value);
    if(!data)return toast("Ce code ne marche pas. Vérifie que tu l'as copié en entier.");
    const nb=Object.values(data.words||{}).filter(w=>(w.b||0)>=3).length;
    modal(`<div class="woopywrap" style="margin:0 auto">${woopySVG("normal")}</div><h2>Restaurer cette sauvegarde ?</h2><p style="margin:0"><b>${esc(data.pseudo||"?")}</b> · ${nb} mots maîtrisés · ${data.bones||0} os · ${Object.keys(data.badges||{}).length} badges.<br>La progression actuelle de cet appareil sera remplacée.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="doimp">Restaurer</button></div>`);
    $("#doimp").onclick=()=>{S=Object.assign(structuredClone(DEF),data);S.equip=Object.assign({head:null,face:null,neck:null,hand:null,left:null},S.equip||{});S.setup=Object.assign({},DEF.setup,S.setup||{});save();applyTheme();lastStage=stageOf();$("#layer").innerHTML="";toast("Progression restaurée ! 欢迎回来");go("home")};};
  bindDict();
  $("#th").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;save();applyTheme();$("#th").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#ss").onclick=()=>{S.pseudo=$("#sp").value.trim()||S.pseudo;S.examDate=$("#sd").value;save();toast("C'est noté 好的！");go("home")};
  $("#reset").onclick=()=>modal(`<h2>Tout effacer ?</h2><p>Os, accessoires, badges et progression seront perdus. Woopy redevient un chiot.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="doreset">Effacer</button></div>`);

go("home");
if(!S.pseudo)askPseudo();
